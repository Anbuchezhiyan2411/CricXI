    <text x="20" y="136" fill="#94a3b8" font-size="11">140 - 160</text><rect x="150" y="123" width="280" height="15" rx="3" fill="#38bdf8" /><text x="440" y="136" fill="#e2e8f0" font-size="11">258 (25.8%)</text>
    <text x="20" y="157" fill="#94a3b8" font-size="11">160 - 180</text><rect x="150" y="144" width="300" height="15" rx="3" fill="#38bdf8" /><text x="460" y="157" fill="#e2e8f0" font-size="11">276 (27.6%)</text>
    <text x="20" y="178" fill="#94a3b8" font-size="11">180 - 200</text><rect x="150" y="165" width="184" height="15" rx="3" fill="#38bdf8" /><text x="344" y="178" fill="#e2e8f0" font-size="11">170 (17.0%)</text>
    <text x="20" y="199" fill="#94a3b8" font-size="11">200 - 220</text><rect x="150" y="186" width="79" height="15" rx="3" fill="#38bdf8" /><text x="239" y="199" fill="#e2e8f0" font-size="11">73 (7.3%)</text>
    <text x="20" y="220" fill="#94a3b8" font-size="11">220 - 240</text><rect x="150" y="207" width="16" height="15" rx="3" fill="#38bdf8" /><text x="176" y="220" fill="#e2e8f0" font-size="11">15 (1.5%)</text>
    <text x="20" y="241" fill="#94a3b8" font-size="11">240 - 260</text><rect x="150" y="228" width="1" height="15" rx="3" fill="#38bdf8" /><text x="161" y="241" fill="#e2e8f0" font-size="11">1 (0.1%)</text>
    <text x="20" y="262" fill="#94a3b8" font-size="11">260+ (Record)</text><rect x="150" y="249" width="0" height="15" rx="3" fill="#38bdf8" /><text x="160" y="262" fill="#e2e8f0" font-size="11">0 (0.0%)</text>
    <text x="20" y="283" fill="#94a3b8" font-size="11">300+ (Extreme)</text><rect x="150" y="270" width="0" height="15" rx="3" fill="#38bdf8" /><text x="160" y="283" fill="#e2e8f0" font-size="11">0 (0.0%)</text>
