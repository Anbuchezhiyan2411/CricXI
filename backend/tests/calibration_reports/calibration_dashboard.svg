    <text x="20" y="199" fill="#94a3b8" font-size="11">70 - 100 runs</text><rect x="150" y="180" width="34" height="21" rx="3" fill="#4ade80" /><text x="194" y="199" fill="#e2e8f0" font-size="11">664 (4.8%)</text>
    <text x="20" y="229" fill="#94a3b8" font-size="11">100 - 130 runs</text><rect x="150" y="210" width="5" height="21" rx="3" fill="#4ade80" /><text x="165" y="229" fill="#e2e8f0" font-size="11">102 (0.7%)</text>
    <text x="20" y="259" fill="#94a3b8" font-size="11">130 - 150 runs</text><rect x="150" y="240" width="0" height="21" rx="3" fill="#4ade80" /><text x="160" y="259" fill="#e2e8f0" font-size="11">4 (0.0%)</text>
    <text x="20" y="289" fill="#94a3b8" font-size="11">150+ runs</text><rect x="150" y="270" width="0" height="21" rx="3" fill="#4ade80" /><text x="160" y="289" fill="#e2e8f0" font-size="11">0 (0.0%)</text>
  </g>

  <!-- Panel 3: Strike Rates -->
  <g transform="translate(50, 480)">
