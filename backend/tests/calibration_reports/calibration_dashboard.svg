    <text x="20" y="139" fill="#94a3b8" font-size="11">20 - 40 runs</text><rect x="150" y="120" width="144" height="21" rx="3" fill="#4ade80" /><text x="304" y="139" fill="#e2e8f0" font-size="11">2786 (20.3%)</text>
