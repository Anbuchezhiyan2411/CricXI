    <text x="20" y="134" fill="#94a3b8" font-size="11">100 - 120</text><rect x="150" y="116" width="273" height="20" rx="3" fill="#fbbf24" /><text x="433" y="134" fill="#e2e8f0" font-size="11">1570 (18.0%)</text>
    <text x="20" y="162" fill="#94a3b8" font-size="11">120 - 140</text><rect x="150" y="144" width="300" height="20" rx="3" fill="#fbbf24" /><text x="460" y="162" fill="#e2e8f0" font-size="11">1722 (19.8%)</text>
    <text x="20" y="190" fill="#94a3b8" font-size="11">140 - 160</text><rect x="150" y="172" width="243" height="20" rx="3" fill="#fbbf24" /><text x="403" y="190" fill="#e2e8f0" font-size="11">1397 (16.0%)</text>
    <text x="20" y="218" fill="#94a3b8" font-size="11">160 - 180</text><rect x="150" y="200" width="167" height="20" rx="3" fill="#fbbf24" /><text x="327" y="218" fill="#e2e8f0" font-size="11">959 (11.0%)</text>
    <text x="20" y="246" fill="#94a3b8" font-size="11">180 - 200</text><rect x="150" y="228" width="83" height="20" rx="3" fill="#fbbf24" /><text x="243" y="246" fill="#e2e8f0" font-size="11">480 (5.5%)</text>
    <text x="20" y="274" fill="#94a3b8" font-size="11">200 - 240</text><rect x="150" y="256" width="77" height="20" rx="3" fill="#fbbf24" /><text x="237" y="274" fill="#e2e8f0" font-size="11">446 (5.1%)</text>
    <text x="20" y="302" fill="#94a3b8" font-size="11">240+</text><rect x="150" y="284" width="15" height="20" rx="3" fill="#fbbf24" /><text x="175" y="302" fill="#e2e8f0" font-size="11">88 (1.0%)</text>
  </g>

  <!-- Panel 4: Bowling Spells -->
  <g transform="translate(630, 480)">
    <rect width="520" height="360" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="20" y="30" fill="#f8fafc" font-size="16" font-weight="bold">Bowling Spell Wickets (Per Bowler)</text>
    <text x="20" y="81" fill="#94a3b8" font-size="11">0 wickets</text><rect x="150" y="60" width="300" height="23" rx="3" fill="#f43f5e" /><text x="460" y="81" fill="#e2e8f0" font-size="11">5858 (48.0%)</text>
    <text x="20" y="113" fill="#94a3b8" font-size="11">1 wicket</text><rect x="150" y="92" width="211" height="23" rx="3" fill="#f43f5e" /><text x="371" y="113" fill="#e2e8f0" font-size="11">4124 (33.8%)</text>
    <text x="20" y="145" fill="#94a3b8" font-size="11">2 wickets</text><rect x="150" y="124" width="80" height="23" rx="3" fill="#f43f5e" /><text x="240" y="145" fill="#e2e8f0" font-size="11">1571 (12.9%)</text>
    <text x="20" y="177" fill="#94a3b8" font-size="11">3 wickets</text><rect x="150" y="156" width="23" height="23" rx="3" fill="#f43f5e" /><text x="183" y="177" fill="#e2e8f0" font-size="11">468 (3.8%)</text>
    <text x="20" y="209" fill="#94a3b8" font-size="11">4 wickets</text><rect x="150" y="188" width="7" height="23" rx="3" fill="#f43f5e" /><text x="167" y="209" fill="#e2e8f0" font-size="11">145 (1.2%)</text>
    <text x="20" y="241" fill="#94a3b8" font-size="11">5 wickets (fifer)</text><rect x="150" y="220" width="1" height="23" rx="3" fill="#f43f5e" /><text x="161" y="241" fill="#e2e8f0" font-size="11">27 (0.2%)</text>
    <text x="20" y="273" fill="#94a3b8" font-size="11">6 wickets</text><rect x="150" y="252" width="0" height="23" rx="3" fill="#f43f5e" /><text x="160" y="273" fill="#e2e8f0" font-size="11">4 (0.0%)</text>
    <text x="20" y="305" fill="#94a3b8" font-size="11">7 wickets</text><rect x="150" y="284" width="0" height="23" rx="3" fill="#f43f5e" /><text x="160" y="305" fill="#e2e8f0" font-size="11">0 (0.0%)</text>
