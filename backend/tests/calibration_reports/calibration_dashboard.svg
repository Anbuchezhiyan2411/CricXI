    <text x="20" y="73" fill="#94a3b8" font-size="11">< 100 (Collapse)</text><rect x="150" y="60" width="23" height="15" rx="3" fill="#38bdf8" /><text x="183" y="73" fill="#e2e8f0" font-size="11">22 (2.2%)</text>
    <text x="20" y="94" fill="#94a3b8" font-size="11">100 - 120</text><rect x="150" y="81" width="51" height="15" rx="3" fill="#38bdf8" /><text x="211" y="94" fill="#e2e8f0" font-size="11">47 (4.7%)</text>
